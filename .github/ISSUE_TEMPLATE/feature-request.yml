name: Feature request
description: Propose a new capability or enhancement.
title: "feat: "
labels:
  - type:feature
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Small, focused requests are
        easier to review. Do not post secrets, credentials, or personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
      placeholder: Switching audio outputs takes too many steps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Describe the desired behavior.
      placeholder: Add an audio-output shortcut to the quick settings panel.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and their trade-offs.
      placeholder: A CLI flag would work but is less discoverable.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is explicitly in and out of scope for a first version?
      placeholder: |
        In scope: wired headphones and HDMI outputs.
        Out of scope: per-app routing.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area (optional)
      description: Which area does this belong to, if you know?
      options:
        - Not sure
        - area:governance
        - area:docs
        - area:ci
        - area:security
        - area:infra
      default: 0
    validations:
      required: false
  - type: checkboxes
    id: hygiene
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I am proposing this in the repository that would own it.
          required: true
        - label: I removed secrets, credentials, and personal data.
          required: true
