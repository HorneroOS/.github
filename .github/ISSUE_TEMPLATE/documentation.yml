name: Documentation
description: Report a docs gap, error, or improvement.
title: "docs: "
labels:
  - type:docs
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the docs. Link the page or section when you can.
        Do not post secrets, credentials, or personal data.
  - type: input
    id: location
    attributes:
      label: Docs location
      description: Which page, section, or repository path is this about?
      placeholder: HorneroOS/docs — installation guide, partitioning section
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
      description: Describe the gap, error, or confusion.
      placeholder: The partitioning step does not mention LUKS setups.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: What should the docs say instead? Draft text welcome.
      placeholder: Add a short LUKS note with a link to the arch wiki page.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area (optional)
      description: Which area does this belong to, if you know?
      options:
        - Not sure
        - area:governance
        - area:docs
        - area:ci
        - area:security
        - area:infra
      default: 0
    validations:
      required: false
  - type: checkboxes
    id: hygiene
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets, credentials, and personal data.
          required: true
