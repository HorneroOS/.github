# Self-CI for the governance infrastructure repository.
#
# HorneroOS/.github hosts the engine that governs every other repo, so it
# must not have weaker guarantees than its consumers. This workflow is
# deliberately NOT a caller of the reusable pr-governance workflow: that
# would be a circular self-governance trap (the engine gating its own
# changes through itself). Instead it runs the engine's own test suites
# and deterministic structural checks directly.
#
# Changes to governance/danger or governance/label-sync land only when
# their own build + tests + validation pass here.

name: governance-ci

on:
  push:
    branches: [main]
    paths:
      - governance/**
      - .github/**
      - scripts/**
  pull_request:

permissions:
  contents: read

jobs:
  danger-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: governance/danger/package-lock.json
      - name: Install engine dependencies
        working-directory: governance/danger
        run: npm ci
      - name: Strict TypeScript build
        working-directory: governance/danger
        run: npm run build
      - name: Engine tests
        working-directory: governance/danger
        run: npm test

  label-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: governance/label-sync/package-lock.json
      - name: Install label-sync dependencies
        working-directory: governance/label-sync
        run: npm ci
      - name: Build and validate forms against taxonomy
        working-directory: governance/label-sync
        run: npm run validate
      # No live sync here: the write path runs in label-sync.yml against
      # this repository, and thin callers expose workflow_dispatch
      # dry-run for every other repo.

  org-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate organization YAML
        run: python3 scripts/check-org-yaml.py

  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Verify all actions SHA-pinned
        run: bash scripts/check-action-pins.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Scan for committed secret material
        run: |
          if grep -rEn --exclude-dir=.git --exclude-dir=node_modules --exclude=package-lock.json \
            'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|AKIA[0-9A-Z]{16}|xox[bap]-' .; then
            echo "SECRETS-FAIL: secret-like material found" >&2
            exit 1
          fi
          echo "SECRETS-PASS: no secret material found"
