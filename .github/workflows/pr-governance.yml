# Reusable PR-governance workflow.
#
# Callers pin a full commit SHA with a `governance-*` version comment and
# trigger on `pull_request` (fork-safe: never `pull_request_target` combined
# with checkout + execution of PR code). Least-privilege permissions below.
#
# Two checkouts, two roles:
# - the CALLER repo at the default path: Danger computes the PR diff from
#   here (cwd stays here), while `.github/hornero-governance.yml` is
#   extracted from the trusted base branch (`origin/$BASE_REF`) so a PR
#   cannot weaken or bypass its own governance policy;
# - the ENGINE repo (HorneroOS/.github) at `inputs.engine-ref` under
#   `.governance-engine`: provides the TypeScript Danger engine only.

name: PR governance (reusable)

"on":
  workflow_call:
    inputs:
      engine-ref:
        description: "Pinned ref (full commit SHA) of HorneroOS/.github providing the Danger engine."
        required: true
        type: string
      node-version:
        description: "Pinned Node version for the Danger engine."
        required: false
        default: "22.22.0"
        type: string
    secrets:
      github_token:
        description: "Optional token Danger uses to comment (defaults to GITHUB_TOKEN)."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  danger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout caller (PR under review)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Load trusted governance policy from base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_REF" ]]; then
            if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" >/dev/null; then
              git fetch --no-tags --depth=1 origin "${BASE_REF}"
            fi
            POLICY_OUT="${RUNNER_TEMP}/hornero-governance-base.yml"
            rm -f "$POLICY_OUT"
            for rel in .github/hornero-governance.yml .github/hornero-governance.yaml; do
              if git cat-file -e "origin/${BASE_REF}:${rel}" 2>/dev/null; then
                git show "origin/${BASE_REF}:${rel}" > "$POLICY_OUT"
                break
              fi
            done
            echo "HORNERO_POLICY_PATH=${POLICY_OUT}" >> "$GITHUB_ENV"
          fi

      - name: Checkout governance engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HorneroOS/.github
          ref: ${{ inputs.engine-ref }}
          path: .governance-engine

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: .governance-engine/governance/danger/package-lock.json

      - name: Install engine
        working-directory: .governance-engine/governance/danger
        run: npm ci

      - name: Build engine
        working-directory: .governance-engine/governance/danger
        run: npm run build

      - name: Run Danger (same-repo PR)
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          GITHUB_TOKEN: ${{ secrets.github_token || secrets.GITHUB_TOKEN }}
        run: .governance-engine/governance/danger/node_modules/.bin/danger ci --dangerfile .governance-engine/governance/danger/dist/src/dangerfile.js

      - name: Run Danger (fork PR — step summary)
        if: ${{ github.event.pull_request.head.repo.fork }}
        env:
          GITHUB_TOKEN: ${{ secrets.github_token || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          OUTPUT=$(.governance-engine/governance/danger/node_modules/.bin/danger ci --text-only --dangerfile .governance-engine/governance/danger/dist/src/dangerfile.js 2>&1)
          STATUS=$?
          set -e
          {
            echo "## PR Governance (fork PR)"
            echo ""
            echo "_Fork PRs have read-only \`GITHUB_TOKEN\`; findings are written here instead of a PR comment._"
            echo ""
            echo '```'
            printf '%s\n' "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
