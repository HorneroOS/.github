# Reusable PR-governance workflow.
#
# Callers pin a full commit SHA with a `governance-*` version comment and
# trigger on `pull_request` (fork-safe: never `pull_request_target` combined
# with checkout + execution of PR code). Least-privilege permissions below.
#
# Two checkouts, two roles:
# - the CALLER repo at the default path: Danger computes the PR diff and
#   reads `.github/hornero-governance.yml` from here (cwd stays here);
# - the ENGINE repo (HorneroOS/.github) at `inputs.engine-ref` under
#   `.governance-engine`: provides the TypeScript Danger engine only.

name: PR governance (reusable)

"on":
  workflow_call:
    inputs:
      engine-ref:
        description: "Pinned ref (full commit SHA) of HorneroOS/.github providing the Danger engine."
        required: true
        type: string
      node-version:
        description: "Pinned Node version for the Danger engine."
        required: false
        default: "22.22.0"
        type: string
      github-token:
        description: "Token Danger uses to comment (defaults to GITHUB_TOKEN)."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  danger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout caller (PR under review)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout governance engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HorneroOS/.github
          ref: ${{ inputs.engine-ref }}
          path: .governance-engine

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: .governance-engine/governance/danger/package-lock.json

      - name: Install engine
        working-directory: .governance-engine/governance/danger
        run: npm ci

      - name: Typecheck engine
        working-directory: .governance-engine/governance/danger
        run: npx tsc --noEmit

      - name: Run Danger
        env:
          GITHUB_TOKEN: ${{ inputs.github-token != '' && inputs.github-token || secrets.GITHUB_TOKEN }}
        run: .governance-engine/governance/danger/node_modules/.bin/danger ci --dangerfile .governance-engine/governance/danger/src/dangerfile.ts
